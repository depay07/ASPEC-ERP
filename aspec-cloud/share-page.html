<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ASPEC · 파일 받기</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f1f6f8;color:#173346;font:16px system-ui,sans-serif;padding:24px}main{width:100%;max-width:440px;background:#fff;padding:36px;border:1px solid #dce7eb;border-radius:24px;box-shadow:0 16px 48px #1733460a}.brand{color:#087f8c;font-size:13px;font-weight:800;letter-spacing:3px}h1{font-size:28px;margin:22px 0 10px}p{color:#617889;line-height:1.7}label{display:block;margin:28px 0 10px;font-weight:600}input{width:100%;font:700 28px ui-monospace,monospace;letter-spacing:4px;padding:16px 12px;border:2px solid #dce7eb;border-radius:12px;text-align:center;outline:none}input:focus{border-color:#087f8c}button{width:100%;padding:16px;background:#087f8c;color:#fff;border:0;border-radius:12px;font:700 16px system-ui;margin-top:16px;cursor:pointer}.note{font-size:13px;margin:20px 0 0}
</style></head><body><main><div class="brand">ASPEC CLOUD</div><h1>공유 파일 받기</h1><p>전달받은 8자리 코드를 입력하세요.<br>로그인 없이 파일을 받을 수 있습니다.</p><form action="/s/" method="get"><label for="code">공유 코드</label><input id="code" name="code" type="text" minlength="8" maxlength="11" placeholder="abcd2345" autocapitalize="none" autocomplete="off" spellcheck="false" required aria-describedby="note"><button type="submit">파일 다운로드</button></form><p class="note" id="note">코드는 발급 후 24시간 동안 사용할 수 있습니다.<br>대소문자를 구분하지 않습니다.</p></main></body></html>
